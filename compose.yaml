services:
  poker:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?Ustaw DOMAIN w pliku .env}
      DB_PATH: /data/poker.sqlite
    volumes:
      - poker_data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Ustaw DOMAIN w pliku .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - poker
volumes:
  poker_data:
  caddy_data:
  caddy_config:
